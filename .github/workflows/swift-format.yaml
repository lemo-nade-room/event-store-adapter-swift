name: Swift format

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/swift-format.yaml"
      - "**/*.swift"
      - ".swift-format"
      - ".swift-version"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - id: swift-version
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"

      - uses: vapor/swiftly-action@v0.2.1
        with:
          toolchain: ${{ steps.swift-version.outputs.version }}

      - run: swift format lint --strict --configuration .swift-format -r Sources Tests Package.swift
