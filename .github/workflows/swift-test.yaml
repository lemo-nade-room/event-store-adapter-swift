name: Swift Testing

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/swift-test.yaml"
      - "**/*.swift"
      - ".swift-version"
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04-arm
    env:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8001
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - "8001:8000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: swift-version
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"

      - uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4 # v0.2.1
        with:
          toolchain: ${{ steps.swift-version.outputs.version }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare DynamoDB tables
        shell: bash
        run: |
          for table_name in journal snapshot; do
            aws dynamodb create-table \
              --endpoint-url "$AWS_ENDPOINT_URL_DYNAMODB" \
              --table-name "$table_name" \
              --attribute-definitions AttributeName=pkey,AttributeType=S AttributeName=skey,AttributeType=S \
              --key-schema AttributeName=pkey,KeyType=HASH AttributeName=skey,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST \
              --no-cli-pager

            aws dynamodb wait table-exists \
              --endpoint-url "$AWS_ENDPOINT_URL_DYNAMODB" \
              --table-name "$table_name"
          done

      - run: swift build -Xswiftc -warnings-as-errors

      - run: swift test -Xswiftc -warnings-as-errors
        env:
          MEDIUM_TESTS: "true"
