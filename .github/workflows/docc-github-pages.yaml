name: DocC GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Package.swift"
      - ".swift-version"
      - ".github/workflows/docc-github-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: swift-version
        run: echo "version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"

      - uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4 # v0.2.1
        with:
          toolchain: ${{ steps.swift-version.outputs.version }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-docc-${{ runner.os }}-${{ runner.arch }}

      - name: Build combined DocC documentation
        shell: bash
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          swift package --allow-writing-to-directory docs \
            generate-documentation \
            --target EventStoreAdapter \
            --target EventStoreAdapterDynamoDB \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --warnings-as-errors \
            --transform-for-static-hosting \
            --hosting-base-path "${DOCS_BASE_PATH#/}" \
            --output-path docs

          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./documentation/">
            <title>EventStoreAdapter Documentation</title>
          </head>
          <body>
            <a href="./documentation/">Open the documentation</a>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
